name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs version detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Build package
        run: uv build

      - name: Verify package contents
        run: |
          unzip -l dist/*.whl | head -50
          tar -tzf dist/*.tar.gz | head -50

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          # Install twine in isolated environment
          uvx twine upload dist/* --username __token__ --password "$PYPI_TOKEN"

      - name: Verify published package
        run: |
          # Wait for PyPI to index the package
          sleep 30
          VERSION=$(python -c "import tomllib; f = open('pyproject.toml', 'rb'); data = tomllib.load(f); print(data['project']['version']) if 'version' in data['project'] else print('unknown')")
          pip index versions gmail-archiver-cli | grep -q "$VERSION" && echo "✓ Package successfully published" || echo "⚠ Package not yet indexed"
